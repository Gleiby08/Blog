<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - El Mundo del Baloncesto</title>
    
    <link rel="icon" href="https://cdn.nba.com/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Barra de Progreso de Lectura -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Barra de Navegación -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">Gleiby's Blog</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre-mi.html">Sobre mí</a></li>
            <li><a href="contacto.html" class="active">Contacto</a></li>
        </ul>
        <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- Contenido principal -->
    <div class="container">
        <h1>Contacto</h1>
        <p>¿Tienes alguna pregunta, sugerencia o simplemente quieres hablar de baloncesto? ¡No dudes en enviarme un mensaje!</p>

        <form action="https://formspree.io/f/mjkapazv" method="POST" class="contact-form scroll-reveal fade-up">
            <div class="form-group">
                <input type="text" id="name" name="name" placeholder=" " required>
                <i class="form-icon fas fa-user"></i>
                <label for="name">Tu Nombre</label>
            </div>
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder=" " required>
                <i class="form-icon fas fa-envelope"></i>
                <label for="email">Tu Correo Electrónico</label>
            </div>
            <div class="form-group">
                <textarea id="message" name="message" rows="6" placeholder=" " required></textarea>
                <i class="form-icon fas fa-comment-dots"></i>
                <label for="message">Tu Mensaje</label>
            </div>
            
            <button type="submit" class="cta-button">Enviar Mensaje</button>
        </form>

        <div class="footer">
            <p>© 2024 El Mundo del Baloncesto. Desarrollado por Gleiby Barreto.</p>
            <div class="footer-social">
                <a href="https://github.com/Gleiby08" target="_blank" title="GitHub" class="github-icon"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/gleiby-martinez-b0595a349/" target="_blank" title="LinkedIn" class="linkedin-icon"><i class="fab fa-linkedin"></i></a>
                <a href="https://wa.me/TUNUMERODEWHATSAPP" target="_blank" title="WhatsApp" class="whatsapp-icon"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
